<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Открытка</title>
<style>
:root {
  --bg-color: #f7ebe1;
  --pink-main: #ff85a1;
  --pink-light: #fbc4d0;
  --pink-dark: #e05275;
  --window-bg: #fff5f7;
  --text-color: #4a4a4a;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
  background-color: var(--bg-color);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  position: relative;
}

/* --- ФОНОВЫЕ ЧАСТИЦЫ --- */
.particle {
  position: absolute;
  pointer-events: none;
  animation: floatUp 4s linear infinite;
  opacity: 0.6;
  font-size: 1.5rem;
}

@keyframes floatUp {
  0%   { transform: translateY(100vh) scale(0); opacity: 0; }
  50%  { opacity: 0.8; }
  100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}

/* --- СЦЕНА 1: КОНВЕРТ --- */
.envelope-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  transition: transform 0.3s ease;
}

.envelope-wrapper:hover {
  transform: scale(1.05);
}

.envelope-text {
  margin-bottom: 15px;
  font-size: 1.2rem;
  color: var(--pink-dark);
  font-weight: bold;
  background: white;
  padding: 8px 20px;
  border-radius: 20px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

.envelope {
  position: relative;
  width: 280px;
  height: 180px;
  background: var(--pink-light);
  border-radius: 0 0 10px 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  display: flex;
  justify-content: center;
  align-items: flex-end;
  transition: transform 0.6s ease;
}

/* Клапан конверта (треугольник сверху) */
.envelope::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 0;
  height: 0;
  border-left: 140px solid transparent;
  border-right: 140px solid transparent;
  border-top: 90px solid var(--pink-main);
  border-radius: 10px 10px 0 0;
  transform-origin: top;
  transition: transform 0.6s ease;
  z-index: 2;
}

/* Когда конверт открыт — клапан откидывается */
.envelope.open::before {
  transform: rotateX(180deg);
}

/* Письмо, выглядывающее из конверта */
.letter {
  position: absolute;
  bottom: 10px;
  width: 240px;
  height: 150px;
  background: var(--window-bg);
  border-radius: 8px;
  padding: 15px;
  text-align: center;
  color: var(--text-color);
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  transform: translateY(0);
  transition: transform 0.8s ease 0.4s, opacity 0.8s ease 0.4s;
  opacity: 0;
  z-index: 1;
}

.envelope.open .letter {
  transform: translateY(-120px);
  opacity: 1;
  z-index: 3;
}

.letter h2 {
  color: var(--pink-dark);
  font-size: 1.1rem;
  margin-bottom: 8px;
}

.letter p {
  font-size: 0.85rem;
  line-height: 1.4;
}

/* Полностью развёрнутая открытка */
.card {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.5);
  width: 320px;
  background: var(--window-bg);
  border-radius: 16px;
  padding: 30px 25px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0,0,0,0.2);
  opacity: 0;
  pointer-events: none;
  transition: transform 0.6s ease, opacity 0.6s ease;
  z-index: 10;
}

.card.show {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
  pointer-events: auto;
}

.card .heart {
  font-size: 3rem;
  animation: pulse 1.2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.15); }
}

.card h1 {
  color: var(--pink-dark);
  font-size: 1.5rem;
  margin: 15px 0 10px;
}

.card p {
  color: var(--text-color);
  font-size: 0.95rem;
  line-height: 1.6;
  margin-bottom: 20px;
}

.card button {
  background: var(--pink-main);
  color: white;
  border: none;
  padding: 10px 25px;
  border-radius: 25px;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.3s ease, transform 0.2s ease;
}

.card button:hover {
  background: var(--pink-dark);
  transform: scale(1.05);
}

/* Затемнение фона при показе открытки */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.3);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.6s ease;
  z-index: 5;
}

.overlay.show {
  opacity: 1;
  pointer-events: auto;
}
</style>
</head>
<body>

<!-- Фоновые частицы создаются через JS -->

<div class="overlay" id="overlay"></div>

<!-- Сцена 1: конверт -->
<div class="envelope-wrapper" id="envelopeWrapper">
  <div class="envelope-text">💌 Нажми на меня</div>
  <div class="envelope" id="envelope">
    <div class="letter">
      <h2>Для тебя 💕</h2>
      <p>Здесь спрятано что-то очень важное...</p>
    </div>
  </div>
</div>

<!-- Сцена 2: открытка -->
<div class="card" id="card">
  <div class="heart">💖</div>
  <h1>Я тебя люблю котя!</h1>
  <p>Пусть каждый день будет наполнен теплом, заботой и улыбками. Ты — лучшее, что случилось со мной, я тебя люблю всем сердцем мой любимый!</p>
  <button id="closeBtn">Закрыть</button>
</div>

<script>
/* --- Фоновые частицы --- */
const emojis = ['💗', '💕', '💖', '🌸', '✨', '💘'];
for (let i = 0; i < 20; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
  p.style.left = Math.random() * 100 + 'vw';
  p.style.animationDelay = Math.random() * 4 + 's';
  p.style.animationDuration = (3 + Math.random() * 3) + 's';
  document.body.appendChild(p);
}

/* --- Логика открытки --- */
const envelope = document.getElementById('envelope');
const wrapper = document.getElementById('envelopeWrapper');
const card = document.getElementById('card');
const overlay = document.getElementById('overlay');
const closeBtn = document.getElementById('closeBtn');

let opened = false;

wrapper.addEventListener('click', () => {
  if (opened) return;
  opened = true;

  // Открываем конверт — клапан откидывается, письмо выезжает
  envelope.classList.add('open');

  // Через паузу показываем полную открытку
  setTimeout(() => {
    card.classList.add('show');
    overlay.classList.add('show');
  }, 1200);
});

function closeCard() {
  card.classList.remove('show');
  overlay.classList.remove('show');

  // Возвращаем конверт в исходное состояние
  setTimeout(() => {
    envelope.classList.remove('open');
    opened = false;
  }, 600);
}

closeBtn.addEventListener('click', closeCard);
overlay.addEventListener('click', closeCard);
</script>
</body>
</html>
